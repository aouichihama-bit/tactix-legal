<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drills shared with you · Tactix</title>
<meta name="description" content="A coach shared training drills with you on Tactix. Open them in the app to get your own editable copy.">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c121e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Changa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Colours mirror the app (src/theme/useTheme.ts): light by default, dark with the device. */
  :root {
    --bg: #f5f7fb; --card: #ffffff; --line: #e6ebf2; --border: #d5dde8;
    --text: #132036; --soft: #5a6a80; --primary: #2f6db8; --accent: #d4701a;
    --nav: #13284a; --on-nav: #ffffff; --shadow: 0 1px 2px rgba(19,32,54,0.05), 0 6px 18px rgba(19,32,54,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c121e; --card: #151e2e; --line: #26324a; --border: #26324a;
      --text: #eef2f7; --soft: #93a1b8; --primary: #4f86cf; --accent: #e67e22;
      --nav: #e8eef7; --on-nav: #13284a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: Barlow, "Segoe UI", Tahoma, Arial, sans-serif;
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
  }
  [lang="ar"] body, html[lang="ar"] { font-family: Changa, Tahoma, Arial, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 40px; }
  .brand { font-family: Oswald, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 1.5px; color: var(--text); text-decoration: none; }
  .brand .x { color: var(--accent); }
  h1, .card h2, .get h3 { font-family: Oswald, "Segoe UI", sans-serif; font-weight: 600; letter-spacing: 0.2px; }
  html[lang="ar"] h1, html[lang="ar"] .card h2, html[lang="ar"] .get h3 { font-family: Changa, Tahoma, sans-serif; }
  h1 { font-size: 26px; line-height: 1.3; margin: 22px 0 6px; }
  .sub { color: var(--soft); margin: 0 0 22px; font-size: 15px; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    font-size: 16px; border-radius: 999px; padding: 14px 18px; margin: 0 0 12px;
  }
  .btn.main { background: var(--nav); color: var(--on-nav); }
  .btn.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .code {
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 14px;
    padding: 14px 16px; margin: 0 0 26px; font-size: 14px; color: var(--soft);
  }
  .code b { display: block; font-size: 26px; letter-spacing: 3px; color: var(--text); margin-top: 4px; font-family: Consolas, Menlo, monospace; direction: ltr; text-align: start; }
  .card {
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 18px;
    padding: 16px; margin: 0 0 14px;
  }
  .card h2 { font-size: 18px; margin: 0; }
  .min { color: var(--accent); font-weight: 700; font-size: 13px; }
  .card p { color: var(--soft); margin: 8px 0 0; font-size: 14.5px; white-space: pre-line; }
  .plate { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; margin-top: 12px; text-align: center; }
  .plate img { max-width: 100%; max-height: 360px; display: inline-block; }
  .get { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--soft); font-size: 14.5px; }
  .get h3 { color: var(--text); font-size: 16px; margin: 0 0 8px; }
  .get ol { padding-inline-start: 20px; margin: 8px 0 0; }
  .get a { color: var(--primary); }
  .msg { color: var(--soft); text-align: center; padding: 40px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">TACTI<span class="x">X</span></a>

  <p class="msg" id="loading">Loading…</p>
  <p class="msg" id="missing" hidden></p>

  <div id="share" hidden>
    <h1 id="headline"></h1>
    <p class="sub" id="lead"></p>
    <a class="btn main" id="open" href="#"></a>
    <div class="code"><span id="codeHint"></span><b id="code"></b></div>
    <div id="drills"></div>
  </div>

  <div class="get" id="get">
    <h3 id="getTitle"></h3>
    <div id="getText"></div>
  </div>
</div>

<!-- The app's own court drawing code (src/utils/courtSvg.ts, bundled with
     esbuild), so a drill looks exactly as it does on the phone. -->
<script src="court.js"></script>
<script>
(function () {
  var PROJECT = 'coachmate-6f0fa';
  var KEY = 'AIzaSyAQ_FRi9bmv1X2Gfj9evgaJT_oTf-dGVsQ';
  var PKG = 'com.aouichi.tactix';
  // The public store page (production since 16 Nov 2026).
  var STORE = 'https://play.google.com/store/apps/details?id=' + PKG;

  var ar = (navigator.language || '').toLowerCase().indexOf('ar') === 0;
  var T = ar ? {
    loading: 'جارٍ التحميل…',
    one: 'أرسل لك {from} تمرينًا', two: 'أرسل لك {from} تمرينين', many: 'أرسل لك {from} {n} تمارين', many11: 'أرسل لك {from} {n} تمرينًا',
    lead: 'افتحه في Tactix لتحصل على نسختك الخاصة، جاهزة للتعديل.',
    open: 'فتح في Tactix',
    codeHint: 'أو في Tactix: التدريب ← تكرار ← من مدرب آخر، وأدخل الرمز:',
    min: 'د',
    missing: 'لا توجد تمارين بهذا الرمز. ربما الرابط ناقص، أو مرّ عليه أكثر من 90 يومًا.',
    getTitle: 'ليس لديك Tactix؟',
    getText: 'حمّل Tactix مجانًا من <a id="g1">Google Play</a>، ثم ارجع إلى هذه الصفحة واضغط «فتح في Tactix» لتحصل على التمارين.'
  } : {
    loading: 'Loading…',
    one: '{from} sent you a drill', many: '{from} sent you {n} drills',
    lead: 'Open it in Tactix to get your own copy, ready to edit.',
    open: 'Open in Tactix',
    codeHint: 'Or in Tactix, go to Training → Reuse → From another coach and enter:',
    min: 'min',
    missing: 'No drills found here. The link may be cut short, or older than 90 days.',
    getTitle: 'Don’t have Tactix?',
    getText: 'Get Tactix free on <a id="g1">Google Play</a>, then come back to this page and tap “Open in Tactix” to get the drills.'
  };
  if (ar) { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }

  var $ = function (id) { return document.getElementById(id); };
  $('loading').textContent = T.loading;
  $('getTitle').textContent = T.getTitle;
  $('getText').innerHTML = T.getText; // our own fixed text, no share data
  $('g1').href = STORE;

  function fail() {
    $('loading').hidden = true;
    $('missing').textContent = T.missing;
    $('missing').hidden = false;
  }

  var raw = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!/^[2-9A-HJKMNP-Z]{8}$/.test(raw)) return fail();
  var code = raw;

  // Firestore REST value → plain JS (only the shapes a share uses).
  function val(v) {
    if (!v) return undefined;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return Number(v.integerValue);
    return undefined;
  }

  fetch('https://firestore.googleapis.com/v1/projects/' + PROJECT +
        '/databases/(default)/documents/sharedDrills/' + code + '?key=' + KEY)
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (docu) {
      var f = docu.fields || {};
      var from = String(val(f.from) || 'A coach');
      var sport = String(val(f.sport) || 'custom');
      var drills = JSON.parse(val(f.blob) || '[]');
      if (!Array.isArray(drills) || !drills.length) return fail();

      var n = drills.length;
      $('headline').textContent = (n === 1 ? T.one : n === 2 && T.two ? T.two : n > 10 && T.many11 ? T.many11 : T.many)
        .replace('{from}', from).replace('{n}', n);
      $('lead').textContent = T.lead;
      $('code').textContent = code.slice(0, 4) + '-' + code.slice(4);
      $('codeHint').textContent = T.codeHint;

      var path = 'training/received?c=' + code;
      var open = $('open');
      open.textContent = T.open;
      // Android Chrome opens custom schemes through an intent URL; if the app
      // is missing it falls back to the store page instead of an error.
      open.href = /android/i.test(navigator.userAgent)
        ? 'intent://' + path + '#Intent;scheme=crkapp;package=' + PKG +
          ';S.browser_fallback_url=' + encodeURIComponent(STORE) + ';end'
        : 'crkapp://' + path;

      var list = $('drills');
      drills.forEach(function (ex) {
        var card = document.createElement('div');
        card.className = 'card';
        var h = document.createElement('h2');
        h.dir = 'auto';
        h.textContent = ex.title || '—';
        card.appendChild(h);
        if (ex.minutes) {
          var m = document.createElement('div');
          m.className = 'min';
          m.textContent = ex.minutes + ' ' + T.min;
          card.appendChild(m);
        }
        if (ex.description) {
          var p = document.createElement('p');
          p.dir = 'auto';
          p.textContent = ex.description;
          card.appendChild(p);
        }
        (ex.drawings || []).forEach(function (d) {
          if (!d || !Array.isArray(d.strokes) || !d.strokes.length) return;
          try {
            // As an <img>, never inline: a share is written by another phone,
            // and a browser runs no script inside an image.
            var svg = window.TactixCourt.drawingSvg(sport, d);
            var plate = document.createElement('div');
            plate.className = 'plate';
            var img = document.createElement('img');
            img.alt = ex.title || '';
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            plate.appendChild(img);
            card.appendChild(plate);
          } catch (e) { /* a drawing this page can't draw is skipped */ }
        });
        list.appendChild(card);
      });

      $('loading').hidden = true;
      $('share').hidden = false;
    })
    .catch(fail);
})();
</script>
</body>
</html>
